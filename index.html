  if (urgent.length) {
    const ul = el("ul");
    urgent.slice(0, 3).forEach(({ g, left }) => ul.append(el("li", {},
      el("span", { class: "left" }, left === 0 ? "今日まで" : `あと${left}日`), g.name || "")));
    root.append(el("section", { class: "alert" }, el("h3", {}, "締切まで1週間以内"), ul,
      el("a", { href: "issue.html?s=alert#" + d.id }, "締切アラートを見る →")));
  }

  const active = goods.filter((g) => g.status !== "終了").length;
  const tiles = [
    { s: "goods", t: "グッズ情報", n: goods.length ? `${active}件` : null, d: "販売期間・通販・事後通販の有無を締切が近い順に", show: goods.length },
    { s: "stamp", t: "スタンプラリー", n: (d.stamprally || []).length ? `${d.stamprally.length}件` : null, d: (d.stamprally || [])[0]?.title, show: (d.stamprally || []).length },
    { s: "feature", t: `今週の特集${d.feature?.kind ? `（${d.feature.kind}）` : ""}`, d: d.feature?.title, show: d.feature },
    { s: "upcoming", t: "予定・イベント", n: (d.upcoming || []).length ? `${d.upcoming.length}件` : null, d: "ライブ・上映・コラボ・物販の日程", show: (d.upcoming || []).length },
    { s: "watch", t: "再販ウォッチ", n: (d.watch || []).length ? `${d.watch.length}件` : null, d: "買い逃したグッズの再販・事後通販を見張り中", show: (d.watch || []).length },
    { s: "topics", t: "ニュース・トピック", d: (d.sections || []).map((x) => x.name).slice(0, 4).join("・"), show: (d.sections || []).length },
  ];
  const grid = el("div", { class: "grid" });
  tiles.filter((x) => x.show).forEach((x) => grid.append(el("a", { class: "tile", href: `issue.html?s=${x.s}#${d.id}` },
    el("span", { class: "t" }, x.t, x.n ? el("span", { class: "n" }, x.n) : null),
    x.d ? el("span", { class: "d" }, x.d) : null)));
  root.append(el("h2", { class: "sec" }, "今週号のメニュー"), grid);

  const g2 = el("div", { class: "grid" });
  [["guide.html", "はじめての佐賀・聖地巡礼", "車なし・車ありのモデルコースと巡礼マナー"],
   ["access.html", "佐賀の移動ガイド", "空港・主な駅からのバス、レンタカー、自転車、フランシュシュ号"]]
    .forEach(([href, t, desc]) => g2.append(el("a", { class: "tile guide", href },
      el("span", { class: "t" }, t), el("span", { class: "d" }, desc))));
  root.append(el("h2", { class: "sec" }, "ガイド"), g2);

  const ol = el("ol", { class: "issues" });
  issues.forEach((x) => ol.append(el("li", {}, el("a", { href: "issue.html#" + x.id },
    el("span", { class: "no" }, `第${no(x.id)}号`),
    el("span", { class: "h" }, x.headline || "", el("span", { class: "w" }, `${x.weekLabel || ""}　${md(x.rangeFrom)}〜${md(x.rangeTo)}`))))));
  root.append(el("h2", { class: "sec" }, "バックナンバー"), ol);
})();
</script>
